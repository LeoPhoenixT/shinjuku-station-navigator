name: Build and publish Docker image

on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    outputs:
      image: ${{ steps.publish.outputs.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install verification dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build Docker image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image before publication
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="${IMAGE_TAGS%%$'\n'*}"
          test -n "$image"
          docker run --detach --name shinjuku-publish-smoke --publish 127.0.0.1:8080:8080 "$image"
          trap 'docker logs shinjuku-publish-smoke; docker rm --force shinjuku-publish-smoke' EXIT
          docker exec shinjuku-publish-smoke nginx -t
          docker exec shinjuku-publish-smoke sh -c '! command -v node && ! command -v curl'
          npm run container:verify -- http://127.0.0.1:8080
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' shinjuku-publish-smoke)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 1
          done
          docker inspect --format '{{json .State.Health}}' shinjuku-publish-smoke
          exit 1

      - name: Publish verified image
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="${IMAGE_TAGS%%$'\n'*}"
          image_id=$(docker image inspect --format '{{.Id}}' "$image")
          while IFS= read -r tag; do
            test -n "$tag" || continue
            test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$image_id"
            push_log=$(docker push "$tag")
            printf '%s\n' "$push_log"
            if [[ "$tag" == "$image" ]]; then
              digest=$(awk '/digest: sha256:/ { print $(NF-2) }' <<< "$push_log")
            fi
          done <<< "$IMAGE_TAGS"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [[ "$main_sha" != "$GITHUB_SHA" ]]; then exit 0; fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "image=${image%:*}@$digest" >> "$GITHUB_OUTPUT"
          fi

  promote-latest:
    needs: build-and-push
    if: needs.build-and-push.outputs.image != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-promote-latest
      cancel-in-progress: false
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the verified main image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping latest: this run is no longer the tip of main."
            exit 0
          fi
          test -n "$IMAGE"
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE%@*}:latest" "$IMAGE"
